services:
  mycatalog:
    image: mycatalog:latest
    container_name: MyCatalog
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MyCatalog: Host=postgres;Port=5432;Database=mycatalog;Username=mycatalog;Password=mycatalog_dev_password;GSS Encryption Mode=Disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: MyCatalog-Postgres
    environment:
      POSTGRES_DB: mycatalog
      POSTGRES_USER: mycatalog
      POSTGRES_PASSWORD: mycatalog_dev_password
    ports:
      - "5433:5432"
    volumes:
      - mycatalog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mycatalog -d mycatalog" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mycatalog-postgres-data:
